name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - release-please--branches--**

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify a single reth revision in Cargo.lock
        run: .github/scripts/check_reth_pin.sh
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The Docker image builds with `cargo build --locked`, which only runs after merge.
      # Catch a stale Cargo.lock here instead. On release-please PRs, the lock bump comes
      # from the Cargo.lock entries in release-please-config.json.
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - uses: taiki-e/install-action@nextest
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.5.0
      - name: Run tests
        run: just test

  evm-i686:
    name: evm-i686
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: i686-unknown-linux-gnu
      - name: Install multilib support
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: evm-i686
      - name: Test EVM length operands
        run: cargo test --locked -p alethia-reth-evm --lib --target i686-unknown-linux-gnu length_operand

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.5.0
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: extractions/setup-just@v2
        with:
          just-version: 1.5.0
      - run: just clippy
