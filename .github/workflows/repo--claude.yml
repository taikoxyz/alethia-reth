name: Claude Code
# https://docs.anthropic.com/en/docs/claude-code/github-actions

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # Only org owners/members/collaborators can trigger this: issue_comment runs with repo secrets
    # and is not covered by the fork-PR approval gate, so any GitHub user could otherwise start it.
    if: >-
      github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    # GitHub-hosted: fresh VM per job; never run PR code on shared self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required by claude-code-action to obtain its GitHub App token
    steps:
      - name: Fetch owner/repo of pull request
        uses: alessbell/pull-request-comment-branch@ef3408c9757d05f89cb525036383033a313758a0 # v2.1.0
        id: comment-branch
      - name: Refuse pull requests from forks
        # Claude runs this repo's build and tests (cargo/just), so fork code must never be checked out here.
        env:
          HEAD_REPO: ${{ steps.comment-branch.outputs.head_owner }}/${{ steps.comment-branch.outputs.head_repo }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Refusing to run: PR head is $HEAD_REPO, not $BASE_REPO (fork PRs are not supported)." >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SECURITY: Pin to exact commit at comment time to prevent TOCTOU attacks
          ref: ${{ steps.comment-branch.outputs.head_sha }}
          repository: ${{ steps.comment-branch.outputs.head_owner }}/${{ steps.comment-branch.outputs.head_repo }}
          # Fetch more history for better git operations
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # beta
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "30000" # any safe value < 32000 to avoid reaching token limit
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-4-5-20250929"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Allow Claude to run specific commands
          allowed_tools: |
            mcp__github__create_pull_request
            Bash(cargo check --workspace --all-features)
            Bash(cargo test --workspace --all-features)
            Bash(just fmt-check)
            Bash(just clippy)
            Bash(just test)
            Bash(cat *)
            Bash(find *)
            Bash(grep *)
            Bash(ls *)
            Bash(git remote remove fork-pr-*)
            WebFetch(domain:docs.anthropic.com)

          # Add custom instructions for Claude to customize its behavior for your project
          custom_instructions: |
            This repository is a Rust Cargo workspace with crates under `crates/` and the binary in `bin/alethia-reth`.
            Use Rust-native checks (`just fmt-check`, `just clippy`, `just test`, or equivalent cargo commands).
            You MUST follow the development workflow described in CLAUDE.md.
            You MUST make sure the tests are passing before creating a pull request.
            You MUST open a draft pull request after creating a branch.
            You MUST create a pull request after completing your task.
            You can create pull requests using the `mcp__github__create_pull_request` tool.
