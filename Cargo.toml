[workspace]
members = [
    "bin/alethia-reth",
    "crates/block",
    "crates/chainspec",
    "crates/cli",
    "crates/consensus",
    "crates/db",
    "crates/evm",
    "crates/node",
    "crates/payload",
    "crates/primitives",
    "crates/rpc",
    "crates/rpc-types",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
# alloy
alloy-chains = { version = "0.2.33", default-features = false }
alloy-consensus = { version = "2.3.0", default-features = false }
alloy-eips = { version = "2.3.0", default-features = false }
alloy-evm = { version = "0.38.0", default-features = false }
alloy-genesis = { version = "2.3.0", default-features = false }
alloy-hardforks = "0.4.7"
alloy-json-rpc = { version = "2.3.0", default-features = false }
alloy-network = { version = "2.3.0", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
] }
alloy-rlp = { version = "0.3.16", default-features = false, features = [
    "core-net",
] }
alloy-rpc-client = { version = "2.3.0", default-features = false }
alloy-rpc-types-debug = { version = "2.3.0", default-features = false }
alloy-rpc-types-engine = { version = "2.3.0", default-features = false }
alloy-rpc-types-eth = { version = "2.3.0", default-features = false }
alloy-rpc-types-trace = { version = "2.3.0", default-features = false }
alloy-rpc-types-txpool = { version = "2.3.0", default-features = false }
alloy-serde = { version = "2.3.0", default-features = false }
alloy-signer = { version = "2.3.0", default-features = false }
alloy-signer-local = { version = "2.3.0", default-features = false }
alloy-sol-types = { version = "1.6.1", default-features = false }

# general utilities
arbitrary = "1.3"
async-trait = "0.1.68"
auto_impl = "1"
clap = "4"
derive_more = { version = "2", default-features = false, features = ["full"] }
eyre = "0.6"
futures-util = { version = "0.3", default-features = false }
humantime = "2.3"

# rpc
jsonrpsee = "0.26.0"
jsonrpsee-core = "0.26.0"
jsonrpsee-http-client = "0.26.0"
jsonrpsee-server = "0.26.0"
jsonrpsee-types = "0.26.0"

# optimism
op-alloy-flz = { version = "0.13.1", default-features = false }

# data encoding
flate2 = "1.1.5"
parity-scale-codec = "3.2.1"

# reth
# Sourced from OP's fork (ethereum-optimism/reth) rather than paradigmxyz/reth so the pin matches
# the reth-optimism-trie workspace exactly; see the note on that dependency below.
# Default features minus `jit`: as of v2.4.x the reth umbrella crate enables its revmc JIT
# by default, which drags the LLVM toolchain into every build. Alethia does not ship the JIT,
# so the default set is spelled out without it. `reth-revm/portable` (a default) is applied
# via this workspace's reth-revm dependency below.
reth = { git = "https://github.com/ethereum-optimism/reth", package = "reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false, features = [
    "jemalloc",
    "otlp",
    "otlp-logs",
    "js-tracer",
    "keccak-cache-global",
    "asm-keccak",
    "gmp",
    "min-trace-logs",
] }
reth-basic-payload-builder = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-chainspec = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-cli = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-cli-commands = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-cli-runner = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-cli-util = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-codecs = { version = "0.6.0", default-features = false }
reth-consensus = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-consensus-common = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-db = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-db-api = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-db-common = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-engine-local = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-engine-primitives = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-engine-tree = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-errors = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-ethereum = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-ethereum-consensus = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-ethereum-engine-primitives = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-ethereum-forks = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-evm = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-evm-ethereum = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-execution-cache = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-execution-types = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-network-peers = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-node-api = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-node-builder = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-node-core = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-node-ethereum = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-payload-builder = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-payload-builder-primitives = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-payload-primitives = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-payload-validator = { git = "https://github.com/ethereum-optimism/reth", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66" }
reth-primitives = { git = "https://github.com/ethereum-optimism/reth", package = "reth-ethereum-primitives", rev = "0fbe428518594611bdd3fdd822eb5968823c8e66", default-features = false }
reth-primitives-traits = { version = "0.6.0", default-features = false }
